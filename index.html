<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>환경법규 개정 정리 | 석유화학 환경안전 실무자를 위한 법령 변경 안내</title>
<meta name="description" content="대기환경보전법, 화학물질관리법, 산업안전보건법 등 환경안전 법규 개정사항을 시행일 기준으로 정리합니다. 석유화학공장 실무자 관점의 영향 검토 포함.">
<meta property="og:title" content="환경법규 개정 정리">
<meta property="og:description" content="환경안전 법규 개정사항을 시행일 기준으로 정리합니다.">
<meta property="og:type" content="website">
<link rel="canonical" href="https://browneyes7979-cell.github.io/env-law/">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12212e;
  --paper:#fbfaf7;
  --rule:#ded9d0;
  --muted:#6b6559;
  --mark:#b03a2e;
  --link:#1d4e78;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Noto Sans KR',sans-serif;
  background:var(--paper);
  color:var(--ink);
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}

header{border-bottom:2px solid var(--ink);padding:36px 0 20px;margin-bottom:8px}
.eyebrow{
  font-size:11px;letter-spacing:.22em;font-weight:700;
  color:var(--mark);margin-bottom:10px;
}
h1{
  font-family:'Noto Serif KR',serif;font-weight:700;
  font-size:30px;line-height:1.35;letter-spacing:-.02em;
}
.tagline{margin-top:10px;font-size:14px;color:var(--muted)}

.list{list-style:none;margin:0}
.entry{border-bottom:1px solid var(--rule);padding:24px 0}
.entry a{text-decoration:none;color:inherit;display:block}
.entry a:hover .title{color:var(--link);text-decoration:underline}
.entry a:focus-visible{outline:2px solid var(--link);outline-offset:4px}

.dateline{
  display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;
  font-size:12px;color:var(--muted);margin-bottom:6px;
}
.enforce{
  font-weight:700;color:var(--mark);
  border:1px solid var(--mark);border-radius:2px;
  padding:1px 7px;font-size:11px;letter-spacing:.02em;
}
.title{
  font-family:'Noto Serif KR',serif;font-weight:600;
  font-size:19px;line-height:1.5;letter-spacing:-.01em;
}
.excerpt{margin-top:7px;font-size:14px;color:var(--muted);line-height:1.7}

.status{padding:40px 0;text-align:center;color:var(--muted);font-size:14px}

footer{
  margin:48px 0 60px;padding-top:24px;
  border-top:1px solid var(--rule);
  font-size:13px;color:var(--muted);
}
footer a{color:var(--link)}
.appbox{
  background:#fff;border:1px solid var(--rule);border-radius:4px;
  padding:18px 20px;margin:36px 0 0;
}
.appbox strong{font-size:15px;display:block;margin-bottom:6px}
.appbox p{font-size:13px;color:var(--muted);margin-bottom:12px}
.appbox a{
  display:inline-block;background:var(--ink);color:#fff;
  padding:9px 18px;border-radius:3px;text-decoration:none;
  font-size:13px;font-weight:700;
}

@media(max-width:600px){
  h1{font-size:24px}
  .title{font-size:17px}
  .wrap{padding:0 16px}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="eyebrow">환경안전 법규</div>
  <h1>환경법규 개정 정리</h1>
  <p class="tagline">석유화학공장 실무자 관점에서 법령 개정사항을 시행일 기준으로 정리합니다.</p>
</header>

<ul class="list" id="list"></ul>
<div class="status" id="status">글 목록을 불러오는 중…</div>

<div class="appbox">
  <strong>법규 개정을 자동으로 받아보세요</strong>
  <p>담당 법규를 등록해 두면 개정될 때마다 영향 검토 내용을 정리해서 알려드립니다. AI 법규비서 · Android 무료.</p>
  <a href="https://play.google.com/store/apps/details?id=com.ailawsecretary.app" target="_blank" rel="noopener">앱 다운로드</a>
</div>

<footer>
  법령 원문은 <a href="https://www.law.go.kr" target="_blank" rel="noopener">국가법령정보센터</a>에서 확인하세요.
  이 사이트의 정리 내용은 참고용이며, 실제 적용 시 원문과 소관부처 유권해석을 확인해야 합니다.
</footer>

</div>

<script>
// ── 설정 ──────────────────────────────────
var REPO  = "browneyes7979-cell/env-law";  // 저장소
var SKIP  = ["index.html"];                 // 목록에서 제외할 파일
// ─────────────────────────────────────────

var listEl   = document.getElementById("list");
var statusEl = document.getElementById("status");

function esc(t){
  return String(t||"")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// 파일 하나에서 제목·시행일·요약 뽑기
function parsePost(html, filename){
  var doc = new DOMParser().parseFromString(html, "text/html");

  var title = (doc.querySelector("h1") || {}).textContent
           || (doc.querySelector("title") || {}).textContent
           || filename.replace(".html","");
  title = title.trim();

  var eyebrow = doc.querySelector(".eyebrow");
  var kind = eyebrow ? eyebrow.textContent.trim() : "";

  var enf = doc.querySelector(".enforce");
  var enforce = enf ? enf.textContent.replace(/^시행일?\s*/,"").trim() : "";

  var meta = doc.querySelector('meta[name="description"]');
  var desc = meta ? meta.getAttribute("content") : "";
  if(!desc){
    var cal = doc.querySelector(".callout");
    if(cal) desc = cal.textContent.replace(/^한\s*줄\s*요약/,"").trim();
  }
  if(desc.length > 120) desc = desc.slice(0,120) + "…";

  // 시행일 없으면 파일명 앞 날짜라도 사용
  if(!enforce){
    var m = filename.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(m) enforce = m[1]+"."+m[2]+"."+m[3];
  }

  return {file:filename, title:title, kind:kind, enforce:enforce, desc:desc};
}

function render(posts){
  if(!posts.length){
    statusEl.textContent = "아직 등록된 글이 없습니다.";
    return;
  }
  // 시행일 최신순
  posts.sort(function(a,b){
    return (b.enforce||"").replace(/\./g,"").localeCompare((a.enforce||"").replace(/\./g,""));
  });

  var html = "";
  posts.forEach(function(p){
    html += '<li class="entry">'
         +  '<a href="./' + encodeURIComponent(p.file) + '">'
         +  '<div class="dateline">'
         +  (p.kind ? '<span>' + esc(p.kind) + '</span>' : '')
         +  (p.enforce ? '<span class="enforce">시행 ' + esc(p.enforce) + '</span>' : '')
         +  '</div>'
         +  '<div class="title">' + esc(p.title) + '</div>'
         +  (p.desc ? '<p class="excerpt">' + esc(p.desc) + '</p>' : '')
         +  '</a></li>';
  });
  listEl.innerHTML = html;
  statusEl.style.display = "none";
}

// 1) 저장소 파일 목록 (API 호출 1회)
fetch("https://api.github.com/repos/" + REPO + "/contents/")
  .then(function(r){
    if(!r.ok) throw new Error("목록 조회 실패 (" + r.status + ")");
    return r.json();
  })
  .then(function(files){
    var targets = files.filter(function(f){
      if(f.type !== "file") return false;
      if(!/\.html$/i.test(f.name)) return false;
      if(SKIP.indexOf(f.name) >= 0) return false;
      if(/^google[0-9a-f]+\.html$/i.test(f.name)) return false;  // 소유권 확인 파일
      return true;
    });

    if(!targets.length){
      statusEl.textContent = "아직 등록된 글이 없습니다.";
      return;
    }

    statusEl.textContent = "글 " + targets.length + "건 불러오는 중…";

    // 2) 각 글은 같은 사이트에서 직접 읽음 (API 제한 없음)
    return Promise.all(targets.map(function(f){
      return fetch("./" + encodeURIComponent(f.name))
        .then(function(r){ return r.ok ? r.text() : ""; })
        .then(function(html){ return html ? parsePost(html, f.name) : null; })
        .catch(function(){ return null; });
    })).then(function(results){
      render(results.filter(Boolean));
    });
  })
  .catch(function(err){
    statusEl.innerHTML = "목록을 불러오지 못했습니다.<br>잠시 후 새로고침해 주세요.";
    console.error(err);
  });
</script>
</body>
</html>
